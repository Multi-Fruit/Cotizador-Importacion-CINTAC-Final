[pytest]
DJANGO_SETTINGS_MODULE = ProyectoFinal.settings_test
python_files = tests.py test_*.py
testpaths = Cotizador tests
addopts = --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output artifacts/e2e
markers =
    e2e: recorridos reales en Chromium con servidor Django y base aislada
